name: 发布实验版

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/build.yml
    with:
      package: true

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v8
        with:
          pattern: build-*
          path: target/package
          merge-multiple: true
      - name: 校验五种归档的实际架构、标识和无用户数据夹带
        run: python release/package.py check
      - name: 从唯一桌面定义生成独立插件
        run: python release/package.py desktop
      - name: 用真实发布归档生成 AUR 文件，不上传 AUR
        run: |
          docker run --rm -e BUILD_UID="$(id -u)" -v "$GITHUB_WORKSPACE:/workspace" -w /workspace archlinux:base-devel bash -eu -c '
            pacman -Syu --noconfirm --needed python
            useradd -m -u "$BUILD_UID" builder
            su builder -c "python release/package.py aur"
          '
      - name: 生成完整校验和与发布说明
        id: metadata
        run: python release/package.py metadata --github-output "$GITHUB_OUTPUT"
      - name: 发布二进制、插件、AUR 提交文件和校验和
        uses: softprops/action-gh-release@v2
        with:
          prerelease: ${{ steps.metadata.outputs.prerelease }}
          body_path: target/package/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          files: ${{ steps.metadata.outputs.files }}
