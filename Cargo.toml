[package]
name = "glosslet"
version = "0.3.0-alpha.1"
edition = "2024"
rust-version = "1.89"
description = "低干扰的桌面划词翻译工具"
license = "GPL-3.0-only"
repository = "https://github.com/AnkRoot/Glosslet"

[dependencies]
anyhow = "1"
reqwest = { version = "0.12", default-features = false, features = ["gzip", "json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.54", features = ["rt", "net", "io-util", "sync", "time", "macros", "rt-multi-thread"] }
interprocess = { version = "2.4", features = ["tokio"] }
winit = { version = "0.30", default-features = false, features = ["rwh_06", "x11"] }
softbuffer = { version = "0.4", default-features = false, features = ["x11", "x11-dlopen"] }
cosmic-text = "0.16"

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", features = ["fs", "net", "process"] }

[target.'cfg(any(target_os = "windows", target_os = "macos"))'.dependencies]
global-hotkey = "0.7"

[target.'cfg(target_os = "windows")'.dependencies]
widestring = "1"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Com", "Win32_System_Threading", "Win32_UI_Accessibility", "Win32_UI_WindowsAndMessaging", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_RemoteDesktop", "Win32_System_Console", "Win32_Security", "Win32_Security_Authorization"] }

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.2"
core-foundation = "0.10"
core-graphics = "0.25"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSRunningApplication", "NSPasteboard", "NSScreen", "NSWindow", "NSView"] }
objc2-foundation = "0.3"
block2 = "0.6"

[target.'cfg(target_os = "linux")'.dependencies]
calloop = "0.13"
calloop-wayland-source = "0.3"
x11rb = { version = "0.13", features = ["randr"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
uuid = "1"
smithay-client-toolkit = { version = "0.19", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "staging"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
